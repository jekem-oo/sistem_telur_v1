name: egg_grading_system
description: "Sistem Klasifikasi & Grading Telur Candling Sinar Merah Berbasis AI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2
  google_generative_ai: ^0.4.6
  image: ^4.2.0
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  intl: ^0.19.0
  audioplayers: ^6.0.0
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
